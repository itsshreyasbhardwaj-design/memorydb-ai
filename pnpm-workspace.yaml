packages:
  - 'apps/*'
  - 'packages/*'

# pnpm blocks postinstall scripts by default and fails the install until each
# package with one is explicitly reviewed. These three are trusted, widely used
# build tools that legitimately need to compile or fetch a native binary:
#   esbuild        — fetches its platform-specific binary (used by Vitest)
#   sharp          — native image processing, pulled in by Next.js
#   unrs-resolver  — native module resolver used by ESLint
# Leaving them unapproved is what made every CI job fail at the install step.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
